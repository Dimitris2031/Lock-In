<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock-In Focus Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Lock-In Focus</h1>
      <p class="tagline">Full-screen study timer that locks distractions until you finish.</p>
    </header>

    <main class="app-layout">
      <section class="timer-controls card">
        <h2>Start a focus block</h2>
        <div class="preset-buttons">
          <button class="preset" data-minutes="25">25 min</button>
          <button class="preset" data-minutes="50">50 min</button>
          <button class="preset" data-minutes="90">90 min</button>
        </div>
        <form id="custom-session" class="custom-session">
          <label>
            Custom length (minutes)
            <input type="number" id="custom-minutes" min="1" max="360" />
          </label>
          <label>
            Tag (optional)
            <input type="text" id="session-tag" maxlength="32" placeholder="e.g. Deep work" />
          </label>
          <label>
            Whitelist note (remind yourself what is allowed)
            <input type="text" id="whitelist-note" maxlength="120" placeholder="Docs, Figma, Calculator" />
          </label>
          <button type="submit" class="primary">Start focus</button>
        </form>
        <a class="playlist" href="https://www.youtube.com/watch?v=4xDzrJKXOOY" target="_blank" rel="noopener">🎧 Open focus playlist</a>
      </section>

      <section class="stats card">
        <h2>Progress</h2>
        <dl>
          <div>
            <dt>Today</dt>
            <dd id="today-total">0m</dd>
          </div>
          <div>
            <dt>This week</dt>
            <dd id="week-total">0m</dd>
          </div>
          <div>
            <dt>Current streak</dt>
            <dd id="streak-count">0 days</dd>
          </div>
        </dl>
        <canvas id="weekly-chart" width="320" height="160" aria-label="Weekly focus chart"></canvas>
      </section>

      <section class="history card">
        <h2>Session history</h2>
        <p class="history-hint">Most recent sessions (stored locally in your browser).</p>
        <ul id="history-list"></ul>
        <button id="clear-history" class="secondary">Clear history</button>
      </section>

      <section class="whitelist card">
        <h2>Allowed tools reminder</h2>
        <textarea id="whitelist" rows="5" placeholder="List the apps or websites you're allowed to use while locked in."></textarea>
        <button id="save-whitelist" class="secondary">Save whitelist</button>
        <p class="whitelist-status" id="whitelist-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-live="polite">
      <div class="overlay-content">
        <h2 id="overlay-timer">00:00</h2>
        <p id="overlay-tag"></p>
        <p id="overlay-note"></p>
        <button id="abort-session" class="secondary">Abort session</button>
      </div>
    </div>

    <audio id="alarm" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>

    <template id="history-item-template">
      <li>
        <div class="history-item">
          <span class="history-time"></span>
          <span class="history-duration"></span>
          <span class="history-tag"></span>
        </div>
      </li>
    </template>

    <script type="module" src="script.js"></script>
  </body>
</html>
